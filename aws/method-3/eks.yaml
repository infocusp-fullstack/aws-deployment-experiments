AWSTemplateFormatVersion: 2010-09-09
Description: This template creates eks cluster and node group

Parameters:
  EKSClusterName:
    Description: Name of the EKS Cluster
    Type: String
    Default: aws-deployments-eks-cluster

  EKSClusterRoleName:
    Description: Name of the EKS Cluster Role
    Type: String
    Default: EKSClusterRole-aws-experiments

  EKSNodeInstanceRoleName:
    Description: Name of the EKS Node Instance Role
    Type: String
    Default: EKSNodeInstanceRole-aws-experiments

  EKSClusterSubnets:
    Description: Comma-separated list of VPC Subnet IDs for the EKS Cluster
    Type: CommaDelimitedList
    Default: subnet-0ef08e10d6000f307,subnet-0a960f1032e9dc58e,subnet-0009006416de50ea2

Resources:
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref EKSClusterRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSNodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref EKSNodeInstanceRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy


  EKSCluster:
    Type: AWS::EKS::Cluster
    DependsOn:
      - EKSClusterRole
      - EKSNodeInstanceRole
    Properties:
      ## For auto mode clusters, uncomment the following section
      # AccessConfig:
      #   AuthenticationMode: API
      #   BootstrapClusterCreatorAdminPermissions: true
      # ComputeConfig:
      #   Enabled: true
      #   NodeRoleArn: !GetAtt EKSNodeInstanceRole.Arn
      # UpgradePolicy:
      #   SupportType: STANDARD

      Name: !Ref EKSClusterName
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds: !Ref EKSClusterSubnets      
      Version: 1.34

  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - EKSCluster
      - EKSNodeInstanceRole
    Properties:
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: SPOT
      ClusterName: !Ref EKSCluster
      DiskSize: 20
      NodeRole: !GetAtt EKSNodeInstanceRole.Arn
      Subnets: !Ref EKSClusterSubnets
      ScalingConfig:
        DesiredSize: 2
        MinSize: 2
        MaxSize: 4
      InstanceTypes:
        - t2.micro
      NodegroupName: !Sub "${EKSClusterName}-nodegroup"
