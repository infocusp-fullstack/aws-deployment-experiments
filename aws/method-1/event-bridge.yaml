AWSTemplateFormatVersion: "2010-09-09"
Description: Create EventBridge Rule to trigger commands in EC2 on ECR push

Parameters:
  EC2AMIID:
    Description: EC2 Instance AMI ID
    Type: String
    Default: ami-02d26659fd82cf299

  EC2InstanceType:
    Description: Default EC2 instance type
    Type: String
    Default: t2.micro

  PublicSSHKeyPair:
    Description: Key Pair for Public SSH connection
    Type: String
    Default: ssh_access_key

  ECRRepoName:
    Description: Name of the ECR Repository
    Type: String
    Default: aws-deployment-experiments-backend

  EC2InstanceName:
    Description: Name of the EC2 Instance
    Type: String
    Default: aws-deployment-experiments-ec2

  EventBridgeRuleName:
    Description: Name of the EventBridge Rule
    Type: String
    Default: aws-deployment-experiments-event-rule

Resources:
  EC2SSMRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    Properties:
      RoleName: EC2SSMRole
      Description: Role for EC2 instances to use SSM
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Tags:
        - Key: Context
          Value: aws-deployment-experiments

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    DependsOn: EC2SSMRole
    DeletionPolicy: Retain
    Properties:
      InstanceProfileName: EC2SSMInstanceProfile
      Roles:
        - !Ref EC2SSMRole

  PublicEC2:
    Type: AWS::EC2::Instance
    DependsOn: EC2InstanceProfile
    Properties:
      ImageId: !Ref EC2AMIID
      InstanceType: !Ref EC2InstanceType
      KeyName: !Ref PublicSSHKeyPair

      SecurityGroupIds:
        - !ImportValue AllowPublicSSH
        - !ImportValue AllowPublicHTTP

      IamInstanceProfile: !Ref EC2InstanceProfile

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 8
            DeleteOnTermination: true

      UserData: 
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update
          apt-get install -y ca-certificates curl unzip
          
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$UBUNTU_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          
          groupadd docker 2>/dev/null || true
          usermod -aG docker ubuntu
          
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install

      Tags:
        - Key: Name
          Value: !Ref EC2InstanceName

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Amazon_EventBridge_Rule_Target_aws_deployment_experiments
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600

  EventBridgeInvokeRunCommandPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: Amazon_EventBridge_Invoke_Run_Command_Policy
      RoleName:
        Ref: EventBridgeRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VisualEditor0
            Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${PublicEC2}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:*:document/AWS-RunShellScript
  
  EventBridgeRule:
    Type: AWS::Events::Rule
    DependsOn:
      - EventBridgeRole
      - EventBridgeInvokeRunCommandPolicy
    Properties:
      Name: !Ref EventBridgeRuleName
      EventPattern: !Sub |
        {
          "source": ["aws.ecr"],
          "detail-type": ["ECR Image Action"],
          "detail": {
            "action-type": ["PUSH"],
            "result": ["SUCCESS"],
            "repository-name": ["${ECRRepoName}"]
          }
        }
      State: ENABLED
      Description: Triggers when new image is pushed to ECR - For office use
      EventBusName: default
      Targets:
        - Id: RunSSM
          Arn: !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
          RoleArn: !GetAtt EventBridgeRole.Arn
          RunCommandParameters:
            RunCommandTargets:
              - Key: InstanceIds
                Values:
                  - !Ref PublicEC2
          Input: !Sub |
              {
                "executionTimeout":["60"],
                "workingDirectory":["/home/ubuntu"],
                "commands":["aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com && (docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepoName}:latest && docker rm -f ${ECRRepoName} >/dev/null 2>&1 || true && docker run -d -p 3000:80 --name=${ECRRepoName} ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepoName}:latest)"]
              }